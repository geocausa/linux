<?xml version="1.0" standalone="yes"?>
<!--
  Driver selection for the /opt/mesa-m3 prefix only (its DATADIR is the prefix;
  system Mesa reads /usr/share/drirc.d and never sees this file).

  - asahi -> zink: the M3 Pro GPU (G15S) is driven by zink over Honeykrisp, and
    this prefix has no gallium asahi driver. Without this rule the EGL
    surfaceless and device platforms fall back to the CPU, and GBM and Wayland
    reach zink only after a failed "asahi" attempt.
  - softpipe / simpledrm -> kms_swrast: a boot framebuffer card stays on the CPU
    instead of having the GPU render into its buffers.
  - m3-dcp / apple -> zink: the native display card is display-only; zink opens
    it through kmsro and renders on the GPU's render node into its buffers.
-->
<driconf>
    <device driver="loader" kernel_driver="asahi">
        <application name="all">
            <option name="dri_driver" value="zink" />
        </application>
    </device>
    <device driver="loader" kernel_driver="softpipe">
        <application name="all">
            <option name="dri_driver" value="kms_swrast" />
        </application>
    </device>
    <device driver="loader" kernel_driver="simpledrm">
        <application name="all">
            <option name="dri_driver" value="kms_swrast" />
        </application>
    </device>
    <device driver="loader" kernel_driver="m3-dcp">
        <application name="all">
            <option name="dri_driver" value="zink" />
        </application>
    </device>
    <device driver="loader" kernel_driver="apple">
        <application name="all">
            <option name="dri_driver" value="zink" />
        </application>
    </device>
</driconf>
