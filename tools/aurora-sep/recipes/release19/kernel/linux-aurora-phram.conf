# Installed by linux-aurora.
# m1n1 describes two memory regions to Linux as "phram": its copy of the Apple
# device tree and its own log. Do not bind them at boot, so the MTD devices stay
# as they were before this kernel had phram. A tool that needs them loads phram
# by name ("modprobe phram"), which this line does not block, and unloads it after.
blacklist phram
